<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2230" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6676"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071BC"/>
    </marker>
  </defs>

  <rect width="1080" height="560" fill="#FFFFFF"/>
  <image x="900" y="20" width="150" height="37" href="../sehc-infra-logo.png"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#1A2230">Web deploy-to-local</text>
  <text x="40" y="71" font-size="14.5" fill="#5A6676">The NAS is the source store only. Each IIS host pulls source to its local disk and serves from there — never off the NAS.</text>

  <!-- NAS -->
  <g filter="url(#sh)"><rect x="60" y="210" width="230" height="120" rx="12" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.8"/></g>
  <text x="175" y="242" font-size="16" font-weight="700" fill="#0071BC" text-anchor="middle">nas · .97</text>
  <text x="175" y="266" font-size="12.5" fill="#1A2230" text-anchor="middle">Samba source store</text>
  <text x="175" y="286" font-size="12.5" fill="#1A2230" text-anchor="middle">canonical web source</text>
  <text x="175" y="312" font-size="11.5" fill="#A63D2F" text-anchor="middle">NOT a web host · NOT backup</text>

  <!-- deploy arrows -->
  <path d="M290,250 C380,250 380,175 470,175" fill="none" stroke="#0071BC" stroke-width="2" marker-end="url(#arb)"/>
  <path d="M290,290 C380,290 380,395 470,395" fill="none" stroke="#0071BC" stroke-width="2" marker-end="url(#arb)"/>
  <text x="380" y="150" font-size="12" fill="#0071BC" text-anchor="middle" font-weight="600">deploy: pull source → D:\app</text>

  <!-- web hosts -->
  <g filter="url(#sh)">
    <rect x="470" y="120" width="300" height="110" rx="12" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.7"/>
    <rect x="470" y="340" width="300" height="110" rx="12" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.7"/>
  </g>
  <text x="490" y="150" font-size="15.5" font-weight="700" fill="#1A2230">ax-web01 · .101</text>
  <text x="490" y="172" font-size="12.5" fill="#5A6676">Windows 2025 + IIS (HTTP)</text>
  <rect x="490" y="184" width="260" height="32" rx="6" fill="#F4F8FC" stroke="#CBD5E1"/>
  <text x="502" y="205" font-size="12.5" font-weight="600" fill="#146B8C">D:\app  ← served locally</text>
  <text x="490" y="370" font-size="15.5" font-weight="700" fill="#1A2230">ax-web02 · .102</text>
  <text x="490" y="392" font-size="12.5" fill="#5A6676">Windows 2025 + IIS (HTTP)</text>
  <rect x="490" y="404" width="260" height="32" rx="6" fill="#F4F8FC" stroke="#CBD5E1"/>
  <text x="502" y="425" font-size="12.5" font-weight="600" fill="#146B8C">D:\app  ← served locally</text>

  <!-- serve to proxy/users -->
  <line x1="770" y1="175" x2="880" y2="230" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="770" y1="395" x2="880" y2="330" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <g filter="url(#sh)"><rect x="880" y="235" width="150" height="90" rx="10" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.6"/></g>
  <text x="955" y="270" font-size="13.5" font-weight="700" fill="#1A2230" text-anchor="middle">Nginx proxy</text>
  <text x="955" y="290" font-size="12" fill="#5A6676" text-anchor="middle">(VIP .100)</text>
  <text x="955" y="308" font-size="11" fill="#5A6676" text-anchor="middle">HTTP over LAN</text>

  <!-- note -->
  <rect x="60" y="380" width="360" height="120" rx="8" fill="#F7F9FB" stroke="#CBD5E1"/>
  <text x="76" y="406" font-size="13" font-weight="700" fill="#1A2230">Why not serve directly off the NAS?</text>
  <text x="76" y="428" font-size="12" fill="#1A2230">• A NAS outage would take BOTH web hosts down</text>
  <text x="76" y="448" font-size="12" fill="#1A2230">  (single point of failure) — defeats HA.</text>
  <text x="76" y="470" font-size="12" fill="#1A2230">• Local disk = faster, isolated per host.</text>
  <text x="76" y="490" font-size="12" fill="#1A2230">• NAS stays a simple, replaceable source store.</text>
</svg>
