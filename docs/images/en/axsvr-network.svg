<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2230" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6676"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071BC"/>
    </marker>
  </defs>

  <rect width="1240" height="940" fill="#FFFFFF"/>
  <image x="1060" y="22" width="150" height="37" href="../sehc-infra-logo.png"/>
  <text x="40" y="48" font-size="26" font-weight="700" fill="#1A2230">Network topology</text>
  <text x="40" y="74" font-size="14.5" fill="#5A6676">Top-down request flow. Every VM has two NICs; the last octet is identical on both subnets — WAN 107.118.210.&lt;n&gt; · LAN 10.1.1.&lt;n&gt;.</text>

  <!-- ZONE BANDS (left labels) -->
  <rect x="40" y="110" width="1160" height="150" rx="14" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.3" stroke-dasharray="2 0"/>
  <text x="60" y="134" font-size="13" font-weight="700" fill="#0071BC">WAN · 107.118.210.x  — public + admin</text>

  <rect x="40" y="300" width="1160" height="560" rx="14" fill="#F8FAFC" stroke="#146B8C" stroke-width="1.3"/>
  <text x="60" y="324" font-size="13" font-weight="700" fill="#146B8C">LAN · 10.1.1.x  — internal service traffic</text>

  <!-- ===== WAN row: admin + users ===== -->
  <g filter="url(#sh)">
    <rect x="150" y="150" width="230" height="86" rx="10" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
    <rect x="470" y="150" width="300" height="86" rx="10" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
  </g>
  <text x="265" y="184" font-size="15.5" font-weight="700" fill="#1A2230" text-anchor="middle">Admin</text>
  <text x="265" y="206" font-size="12.5" fill="#5A6676" text-anchor="middle">SSH / RDP</text>
  <text x="265" y="224" font-size="11.5" fill="#A63D2F" text-anchor="middle">firewall: admin IPs only</text>
  <text x="620" y="184" font-size="15.5" font-weight="700" fill="#1A2230" text-anchor="middle">End users</text>
  <text x="620" y="212" font-size="12.5" fill="#5A6676" text-anchor="middle">HTTPS → Proxy VIP</text>

  <!-- ===== VIP ===== -->
  <line x1="620" y1="236" x2="620" y2="332" stroke="#0071BC" stroke-width="2.2" marker-end="url(#arb)"/>
  <g filter="url(#sh)"><rect x="500" y="334" width="240" height="50" rx="25" fill="#0071BC"/></g>
  <text x="620" y="356" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Proxy VIP · .100</text>
  <text x="620" y="374" font-size="11" fill="#DCEBF7" text-anchor="middle">Keepalived — active-passive entry point</text>

  <!-- ===== Proxy tier ===== -->
  <g filter="url(#sh)">
    <rect x="360" y="430" width="230" height="82" rx="10" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.7"/>
    <rect x="650" y="430" width="230" height="82" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.5" stroke-dasharray="7 4"/>
  </g>
  <text x="475" y="458" font-size="15" font-weight="700" fill="#0071BC" text-anchor="middle">ax-proxy01 · .98</text>
  <text x="475" y="479" font-size="12" fill="#1A2230" text-anchor="middle">Nginx — TLS termination</text>
  <text x="475" y="498" font-size="11.5" fill="#2F7D4F" text-anchor="middle">● ACTIVE (holds VIP)</text>
  <text x="765" y="458" font-size="15" font-weight="700" fill="#5A6676" text-anchor="middle">ax-proxy02 · .99</text>
  <text x="765" y="479" font-size="12" fill="#1A2230" text-anchor="middle">Nginx — TLS termination</text>
  <text x="765" y="498" font-size="11.5" fill="#9AA6B2" text-anchor="middle">○ STANDBY</text>
  <!-- VRRP heartbeat -->
  <line x1="590" y1="471" x2="650" y2="471" stroke="#B4632A" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="620" y="464" font-size="9.5" fill="#B4632A" text-anchor="middle">VRRP</text>
  <!-- VIP to proxy -->
  <path d="M560,384 C520,400 490,410 480,430" fill="none" stroke="#0071BC" stroke-width="2" marker-end="url(#arb)"/>

  <!-- ===== Web tier ===== -->
  <g filter="url(#sh)">
    <rect x="360" y="560" width="230" height="82" rx="10" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.6"/>
    <rect x="650" y="560" width="230" height="82" rx="10" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.6"/>
  </g>
  <text x="475" y="588" font-size="15" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web01 · .101</text>
  <text x="475" y="609" font-size="12" fill="#5A6676" text-anchor="middle">Win2025 + IIS (HTTP)</text>
  <text x="475" y="628" font-size="11.5" fill="#146B8C" text-anchor="middle">app on D:\app</text>
  <text x="765" y="588" font-size="15" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web02 · .102</text>
  <text x="765" y="609" font-size="12" fill="#5A6676" text-anchor="middle">Win2025 + IIS (HTTP)</text>
  <text x="765" y="628" font-size="11.5" fill="#146B8C" text-anchor="middle">app on D:\app</text>
  <!-- proxy -> web (LB) -->
  <line x1="475" y1="512" x2="475" y2="560" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="500" y1="512" x2="740" y2="560" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="905" y="536" font-size="11" fill="#5A6676">HTTP load-balance</text>

  <!-- NAS feeding web (right) -->
  <g filter="url(#sh)"><rect x="940" y="555" width="210" height="92" rx="10" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.5"/></g>
  <text x="1045" y="583" font-size="14.5" font-weight="700" fill="#0071BC" text-anchor="middle">nas · .97</text>
  <text x="1045" y="604" font-size="12" fill="#1A2230" text-anchor="middle">Samba source store</text>
  <text x="1045" y="623" font-size="11" fill="#5A6676" text-anchor="middle">deploy-to-local → D:\app</text>
  <path d="M940,601 C910,601 900,601 880,601" fill="none" stroke="#0071BC" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arb)"/>

  <!-- ===== DB tier ===== -->
  <rect x="330" y="690" width="580" height="150" rx="12" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="350" y="714" font-size="13.5" font-weight="700" fill="#0071BC">PostgreSQL 17 HA — Patroni + etcd (3-node quorum)</text>
  <g filter="url(#sh)">
    <rect x="350" y="726" width="175" height="96" rx="9" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.7"/>
    <rect x="537" y="726" width="175" height="96" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
    <rect x="724" y="726" width="170" height="96" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
  </g>
  <text x="437" y="756" font-size="14.5" font-weight="700" fill="#0071BC" text-anchor="middle">ax-db01 · .103</text>
  <text x="437" y="777" font-size="12.5" fill="#1A2230" text-anchor="middle">PRIMARY</text>
  <text x="437" y="800" font-size="11" fill="#5A6676" text-anchor="middle">read-write</text>
  <text x="624" y="756" font-size="14.5" font-weight="700" fill="#1A2230" text-anchor="middle">ax-db02 · .104</text>
  <text x="624" y="777" font-size="12.5" fill="#1A2230" text-anchor="middle">SYNC replica</text>
  <text x="624" y="800" font-size="11" fill="#5A6676" text-anchor="middle">zero-loss standby</text>
  <text x="809" y="756" font-size="14.5" font-weight="700" fill="#1A2230" text-anchor="middle">ax-db03 · .105</text>
  <text x="809" y="777" font-size="12.5" fill="#1A2230" text-anchor="middle">ASYNC replica</text>
  <text x="809" y="800" font-size="11" fill="#2F7D4F" text-anchor="middle">+ /backup (pgBackRest)</text>
  <!-- replication links -->
  <line x1="525" y1="774" x2="537" y2="774" stroke="#0071BC" stroke-width="1.6" marker-end="url(#arb)"/>
  <line x1="712" y1="774" x2="724" y2="774" stroke="#5A6676" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- web -> db: both web hosts open a multi-host connection; the driver routes writes to the current primary -->
  <path d="M475,642 C475,664 620,668 620,688" fill="none" stroke="#5A6676" stroke-width="1.8"/>
  <path d="M765,642 C765,664 620,668 620,688" fill="none" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="620" y="662" font-size="11" fill="#5A6676" text-anchor="middle">multi-host conn · target_session_attrs=read-write → current primary</text>

  <!-- DevDB standalone -->
  <g filter="url(#sh)"><rect x="960" y="726" width="200" height="96" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.4"/></g>
  <text x="1060" y="756" font-size="14.5" font-weight="700" fill="#1A2230" text-anchor="middle">devdb · .90</text>
  <text x="1060" y="778" font-size="12" fill="#5A6676" text-anchor="middle">standalone PG17</text>
  <text x="1060" y="797" font-size="11.5" fill="#5A6676" text-anchor="middle">(dev only · has internet)</text>
  <text x="1060" y="815" font-size="10.5" fill="#9AA6B2" text-anchor="middle">not part of the cluster</text>
</svg>
