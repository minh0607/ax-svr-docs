<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 660" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2230" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6676"/>
    </marker>
  </defs>

  <rect width="1140" height="660" fill="#FFFFFF"/>
  <image x="960" y="20" width="150" height="37" href="../sehc-infra-logo.png"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#1A2230">Network topology</text>
  <text x="40" y="71" font-size="14.5" fill="#5A6676">Every VM has two NICs. The last octet is the same on both subnets: WAN 107.118.210.&lt;n&gt; · LAN 10.1.1.&lt;n&gt;.</text>

  <!-- WAN band -->
  <rect x="40" y="100" width="1060" height="150" rx="12" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.5"/>
  <text x="60" y="126" font-size="15" font-weight="700" fill="#0071BC">WAN — 107.118.210.x  (users + admin)</text>

  <g filter="url(#sh)"><rect x="70" y="146" width="180" height="80" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/></g>
  <text x="160" y="176" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">Admin</text>
  <text x="160" y="196" font-size="11.5" fill="#5A6676" text-anchor="middle">SSH / RDP</text>
  <text x="160" y="212" font-size="11" fill="#A63D2F" text-anchor="middle">firewall: admin IPs only</text>

  <g filter="url(#sh)"><rect x="300" y="146" width="180" height="80" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/></g>
  <text x="390" y="176" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">End users</text>
  <text x="390" y="196" font-size="11.5" fill="#5A6676" text-anchor="middle">HTTPS → VIP</text>

  <g filter="url(#sh)"><rect x="800" y="146" width="260" height="80" rx="9" fill="#0071BC"/></g>
  <text x="930" y="180" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Proxy VIP · .100</text>
  <text x="930" y="202" font-size="11.5" fill="#DCEBF7" text-anchor="middle">public entry point (Keepalived)</text>

  <!-- LAN band -->
  <rect x="40" y="290" width="1060" height="340" rx="12" fill="#F8FAFC" stroke="#146B8C" stroke-width="1.5"/>
  <text x="60" y="316" font-size="15" font-weight="700" fill="#146B8C">LAN — 10.1.1.x  (internal traffic)</text>

  <!-- edge row -->
  <g filter="url(#sh)">
    <rect x="70" y="336" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.5"/>
    <rect x="290" y="336" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.5"/>
  </g>
  <text x="170" y="362" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">ax-proxy01 · .98</text>
  <text x="170" y="384" font-size="11.5" fill="#5A6676" text-anchor="middle">Nginx + Keepalived</text>
  <text x="390" y="362" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">ax-proxy02 · .99</text>
  <text x="390" y="384" font-size="11.5" fill="#5A6676" text-anchor="middle">Nginx + Keepalived</text>

  <!-- web row -->
  <g filter="url(#sh)">
    <rect x="70" y="420" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.5"/>
    <rect x="290" y="420" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#146B8C" stroke-width="1.5"/>
    <rect x="510" y="420" width="200" height="66" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
  </g>
  <text x="170" y="446" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web01 · .101</text>
  <text x="170" y="468" font-size="11.5" fill="#5A6676" text-anchor="middle">Win2025 + IIS</text>
  <text x="390" y="446" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web02 · .102</text>
  <text x="390" y="468" font-size="11.5" fill="#5A6676" text-anchor="middle">Win2025 + IIS</text>
  <text x="610" y="446" font-size="14" font-weight="700" fill="#1A2230" text-anchor="middle">nas · .97</text>
  <text x="610" y="468" font-size="11.5" fill="#5A6676" text-anchor="middle">Samba source</text>

  <!-- db cluster group -->
  <rect x="740" y="330" width="330" height="230" rx="10" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="760" y="352" font-size="13.5" font-weight="700" fill="#0071BC">PostgreSQL cluster (Patroni + etcd)</text>
  <g filter="url(#sh)">
    <rect x="760" y="366" width="290" height="52" rx="8" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.5"/>
    <rect x="760" y="428" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.3"/>
    <rect x="760" y="490" width="290" height="52" rx="8" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.3"/>
  </g>
  <text x="778" y="398" font-size="13.5" font-weight="700" fill="#1A2230">ax-db01 · .103 — primary</text>
  <text x="778" y="460" font-size="13.5" fill="#1A2230">ax-db02 · .104 — sync replica</text>
  <text x="778" y="522" font-size="13.5" fill="#1A2230">ax-db03 · .105 — async + /backup</text>

  <!-- devdb / mon note -->
  <g filter="url(#sh)"><rect x="510" y="500" width="200" height="60" rx="9" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.3"/></g>
  <text x="610" y="526" font-size="13.5" font-weight="700" fill="#1A2230" text-anchor="middle">devdb · .90</text>
  <text x="610" y="546" font-size="11.5" fill="#5A6676" text-anchor="middle">standalone (has internet)</text>

  <!-- flow arrows -->
  <line x1="930" y1="226" x2="200" y2="336" stroke="#5A6676" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="170" y1="402" x2="170" y2="420" stroke="#5A6676" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="390" y1="402" x2="390" y2="420" stroke="#5A6676" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="490" y1="453" x2="740" y2="392" stroke="#5A6676" stroke-width="1.6" marker-end="url(#ar)"/>
</svg>
