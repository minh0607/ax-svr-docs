<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2230" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6676"/>
    </marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4632A"/>
    </marker>
  </defs>

  <rect width="1180" height="700" fill="#FFFFFF"/>
  <image x="1000" y="20" width="150" height="37" href="../sehc-infra-logo.png"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1A2230">Schema-per-app access model</text>
  <text x="40" y="72" font-size="15" fill="#5A6676">Three layers, never mixed: a person is a login role → a member of a group → the group has rights on a schema.</text>

  <!-- Column headers -->
  <text x="180" y="126" font-size="17" font-weight="700" fill="#0071BC" text-anchor="middle">1 · PERSON</text>
  <text x="180" y="146" font-size="12.5" fill="#5A6676" text-anchor="middle">login role (not superuser)</text>
  <text x="560" y="126" font-size="17" font-weight="700" fill="#0071BC" text-anchor="middle">2 · PERMISSION SET</text>
  <text x="560" y="146" font-size="12.5" fill="#5A6676" text-anchor="middle">group role &lt;schema&gt;_readonly / _readwrite</text>
  <text x="960" y="126" font-size="17" font-weight="700" fill="#0071BC" text-anchor="middle">3 · APPLICATION</text>
  <text x="960" y="146" font-size="12.5" fill="#5A6676" text-anchor="middle">one schema per app</text>

  <line x1="360" y1="110" x2="360" y2="660" stroke="#E3E7EC" stroke-width="1.5"/>
  <line x1="760" y1="110" x2="760" y2="660" stroke="#E3E7EC" stroke-width="1.5"/>

  <!-- People -->
  <g filter="url(#sh)">
    <rect x="80" y="180" width="200" height="46" rx="8" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.4"/>
    <rect x="80" y="360" width="200" height="46" rx="8" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.4"/>
    <rect x="80" y="470" width="200" height="46" rx="8" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.4"/>
  </g>
  <text x="180" y="208" font-size="15" font-weight="600" fill="#1A2230" text-anchor="middle">fi_user</text>
  <text x="180" y="388" font-size="15" font-weight="600" fill="#1A2230" text-anchor="middle">hr_user</text>
  <text x="180" y="498" font-size="15" font-weight="600" fill="#1A2230" text-anchor="middle">prod_acc</text>

  <!-- Groups -->
  <g filter="url(#sh)">
    <rect x="450" y="180" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#2F7D4F" stroke-width="1.4"/>
    <rect x="450" y="250" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
    <rect x="450" y="360" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#2F7D4F" stroke-width="1.4"/>
    <rect x="450" y="430" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#5A6676" stroke-width="1.4"/>
  </g>
  <text x="560" y="207" font-size="14.5" font-weight="600" fill="#2F7D4F" text-anchor="middle">finance_readwrite</text>
  <text x="560" y="277" font-size="14.5" font-weight="600" fill="#5A6676" text-anchor="middle">finance_readonly</text>
  <text x="560" y="387" font-size="14.5" font-weight="600" fill="#2F7D4F" text-anchor="middle">hr_readwrite</text>
  <text x="560" y="457" font-size="14.5" font-weight="600" fill="#5A6676" text-anchor="middle">hr_readonly</text>

  <!-- Schemas -->
  <g filter="url(#sh)">
    <rect x="850" y="176" width="230" height="150" rx="10" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.6"/>
    <rect x="850" y="356" width="230" height="150" rx="10" fill="#FCF6F1" stroke="#B4632A" stroke-width="1.6"/>
  </g>
  <text x="870" y="202" font-size="15" font-weight="700" fill="#0071BC">schema finance</text>
  <rect x="870" y="216" width="190" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="882" y="236" font-size="12.5" fill="#1A2230">finance.fi_cost</text>
  <rect x="870" y="252" width="190" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="882" y="272" font-size="12.5" fill="#1A2230">finance.fi_fee</text>
  <text x="882" y="306" font-size="11.5" fill="#5A6676">+ future tables (auto-granted)</text>

  <text x="870" y="382" font-size="15" font-weight="700" fill="#B4632A">schema hr</text>
  <rect x="870" y="396" width="190" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="882" y="416" font-size="12.5" fill="#1A2230">hr.hr_employee</text>
  <rect x="870" y="432" width="190" height="30" rx="5" fill="#FFFFFF" stroke="#A63D2F"/>
  <text x="882" y="452" font-size="12.5" font-weight="600" fill="#A63D2F">hr.hr_salary  🔒</text>
  <text x="882" y="486" font-size="11.5" fill="#5A6676">sensitive — HR group only</text>

  <!-- membership arrows -->
  <line x1="280" y1="203" x2="450" y2="202" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="365" y="194" font-size="11" fill="#5A6676" text-anchor="middle">member of</text>
  <line x1="280" y1="383" x2="450" y2="382" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- cross-project (prod_acc -> finance_readonly) -->
  <path d="M280,493 C360,493 380,272 450,272" fill="none" stroke="#B4632A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aro)"/>
  <text x="330" y="560" font-size="12" fill="#B4632A" text-anchor="middle" font-weight="600">cross-project read:</text>
  <text x="330" y="578" font-size="11.5" fill="#B4632A" text-anchor="middle">GRANT finance_readonly TO prod_acc;</text>

  <!-- group -> schema (rights) -->
  <line x1="670" y1="202" x2="850" y2="230" stroke="#2F7D4F" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="670" y1="277" x2="850" y2="255" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="670" y1="382" x2="850" y2="410" stroke="#2F7D4F" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="670" y1="457" x2="850" y2="440" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="760" y="188" font-size="11" fill="#5A6676" text-anchor="middle">has rights on</text>

  <!-- bottom note -->
  <rect x="450" y="600" width="630" height="72" rx="8" fill="#F7F9FB" stroke="#CBD5E1"/>
  <text x="466" y="624" font-size="12.5" fill="#1A2230"><tspan font-weight="700">Why prod_acc cannot see hr_salary:</tspan> it is not a member of any hr_ group.</text>
  <text x="466" y="645" font-size="12.5" fill="#1A2230">Default is "no access"; you add a membership to grant. New HR tables stay hidden automatically —</text>
  <text x="466" y="663" font-size="12.5" fill="#1A2230">no per-table REVOKE to remember. Onboarding/offboarding only touches the login role + its groups.</text>
</svg>
