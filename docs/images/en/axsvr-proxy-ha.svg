<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2230" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6676"/>
    </marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0071BC"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#FFFFFF"/>
  <image x="940" y="20" width="150" height="37" href="../sehc-infra-logo.png"/>
  <text x="40" y="46" font-size="25" font-weight="700" fill="#1A2230">Proxy HA — Nginx + Keepalived (VIP)</text>
  <text x="40" y="71" font-size="14.5" fill="#5A6676">TLS terminates at Nginx; a floating VIP (.100) moves to the standby on failover. HTTP load-balanced to two IIS backends.</text>

  <!-- Users -->
  <g filter="url(#sh)"><rect x="430" y="100" width="260" height="52" rx="10" fill="#F4F8FC" stroke="#0071BC" stroke-width="1.6"/></g>
  <text x="560" y="126" font-size="15" font-weight="700" fill="#1A2230" text-anchor="middle">Users / Admin</text>
  <text x="560" y="144" font-size="12" fill="#5A6676" text-anchor="middle">WAN 107.118.210.x — HTTPS</text>

  <!-- VIP -->
  <line x1="560" y1="152" x2="560" y2="196" stroke="#0071BC" stroke-width="2" marker-end="url(#arb)"/>
  <g filter="url(#sh)"><rect x="455" y="198" width="210" height="46" rx="23" fill="#0071BC"/></g>
  <text x="560" y="220" font-size="14.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Proxy VIP · .100</text>
  <text x="560" y="237" font-size="11" fill="#DCEBF7" text-anchor="middle">Keepalived / VRRP — active-passive</text>

  <!-- proxies -->
  <g filter="url(#sh)">
    <rect x="230" y="300" width="260" height="86" rx="10" fill="#FFFFFF" stroke="#0071BC" stroke-width="1.8"/>
    <rect x="630" y="300" width="260" height="86" rx="10" fill="#FFFFFF" stroke="#9AA6B2" stroke-width="1.6" stroke-dasharray="7 4"/>
  </g>
  <text x="360" y="328" font-size="15.5" font-weight="700" fill="#0071BC" text-anchor="middle">ax-proxy01 · .98</text>
  <text x="360" y="349" font-size="12.5" fill="#1A2230" text-anchor="middle">Nginx — TLS termination</text>
  <text x="360" y="368" font-size="12" fill="#2F7D4F" text-anchor="middle">● ACTIVE (holds VIP)</text>
  <text x="760" y="328" font-size="15.5" font-weight="700" fill="#5A6676" text-anchor="middle">ax-proxy02 · .99</text>
  <text x="760" y="349" font-size="12.5" fill="#1A2230" text-anchor="middle">Nginx — TLS termination</text>
  <text x="760" y="368" font-size="12" fill="#9AA6B2" text-anchor="middle">○ STANDBY</text>

  <!-- VIP to active -->
  <path d="M500,232 C420,250 360,270 360,300" fill="none" stroke="#0071BC" stroke-width="2" marker-end="url(#arb)"/>
  <!-- VRRP heartbeat between proxies -->
  <line x1="490" y1="343" x2="630" y2="343" stroke="#B4632A" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="560" y="336" font-size="10.5" fill="#B4632A" text-anchor="middle">VRRP heartbeat</text>
  <text x="560" y="379" font-size="10.5" fill="#9AA6B2" text-anchor="middle">VIP fails over →</text>

  <!-- web backends -->
  <g filter="url(#sh)">
    <rect x="290" y="470" width="230" height="78" rx="10" fill="#F4F8FC" stroke="#146B8C" stroke-width="1.6"/>
    <rect x="600" y="470" width="230" height="78" rx="10" fill="#F4F8FC" stroke="#146B8C" stroke-width="1.6"/>
  </g>
  <text x="405" y="498" font-size="15" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web01 · .101</text>
  <text x="405" y="518" font-size="12" fill="#5A6676" text-anchor="middle">Win2025 + IIS (HTTP)</text>
  <text x="405" y="536" font-size="12" fill="#5A6676" text-anchor="middle">app on D:\app</text>
  <text x="715" y="498" font-size="15" font-weight="700" fill="#1A2230" text-anchor="middle">ax-web02 · .102</text>
  <text x="715" y="518" font-size="12" fill="#5A6676" text-anchor="middle">Win2025 + IIS (HTTP)</text>
  <text x="715" y="536" font-size="12" fill="#5A6676" text-anchor="middle">app on D:\app</text>

  <!-- LB arrows from active proxy to both web -->
  <line x1="330" y1="386" x2="360" y2="470" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="400" y1="386" x2="680" y2="470" stroke="#5A6676" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="470" y="440" font-size="11.5" fill="#5A6676" text-anchor="middle">HTTP load-balance (LAN 10.1.1.x)</text>

  <!-- note -->
  <rect x="900" y="470" width="190" height="78" rx="8" fill="#F7F9FB" stroke="#CBD5E1"/>
  <text x="915" y="493" font-size="11.5" font-weight="700" fill="#1A2230">On failover</text>
  <text x="915" y="512" font-size="11" fill="#1A2230">VIP .100 moves to</text>
  <text x="915" y="527" font-size="11" fill="#1A2230">ax-proxy02; clients</text>
  <text x="915" y="542" font-size="11" fill="#1A2230">keep the same IP.</text>
</svg>
