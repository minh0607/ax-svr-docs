<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1A2423" flood-opacity="0.13"/>
    </filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5A6B68"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#146B63"/>
    </marker>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B4632A"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>

  <text x="60" y="46" font-size="22" font-weight="bold" fill="#1A2423">Chiến lược backup &amp; khôi phục dữ liệu</text>
  <text x="60" y="70" font-size="13" fill="#5A6B68">pgBackRest (vật lý, PITR) + pg_dump (logic) — repo trên đĩa riêng /backup của ax-db03</text>
  <rect x="60" y="82" width="64" height="4" fill="#146B63"/>

  <!-- Sources -->
  <g filter="url(#sh)">
    <rect x="60" y="130" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#146B63" stroke-width="1.6"/>
    <rect x="60" y="250" width="240" height="90" rx="10" fill="#FFFFFF" stroke="#146B63" stroke-width="1.6"/>
  </g>
  <text x="80" y="162" font-size="15" font-weight="bold" fill="#1A2423">ax-db01 · LEADER</text>
  <text x="80" y="184" font-size="12" fill="#5A6B68" font-family="DejaVu Sans Mono, monospace">.103 · /data</text>
  <text x="80" y="205" font-size="11" fill="#5A6B68">archive_command đẩy WAL liên tục</text>

  <text x="80" y="282" font-size="15" font-weight="bold" fill="#1A2423">ax-db02 · SYNC</text>
  <text x="80" y="304" font-size="12" fill="#5A6B68" font-family="DejaVu Sans Mono, monospace">.104 · /data</text>
  <text x="80" y="325" font-size="11" fill="#5A6B68">sẵn sàng đẩy WAL khi thành leader</text>

  <!-- WAL arrows -->
  <line x1="304" y1="175" x2="438" y2="215" stroke="#146B63" stroke-width="2" marker-end="url(#arg)"/>
  <line x1="304" y1="295" x2="438" y2="255" stroke="#146B63" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arg)"/>
  <text x="360" y="148" font-size="11" fill="#146B63" font-weight="bold" text-anchor="middle">WAL streaming</text>

  <!-- Repo on db03 -->
  <g filter="url(#sh)">
    <rect x="442" y="130" width="330" height="230" rx="12" fill="#FFFFFF" stroke="#146B63" stroke-width="2"/>
  </g>
  <rect x="442" y="130" width="330" height="44" rx="12" fill="#146B63"/>
  <rect x="442" y="160" width="330" height="14" fill="#146B63"/>
  <text x="607" y="158" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ax-db03 — repo backup /backup</text>
  <text x="466" y="200" font-size="12.5" fill="#1A2423" font-family="DejaVu Sans Mono, monospace">pgBackRest repo1</text>
  <text x="466" y="222" font-size="11.5" fill="#5A6B68">• đĩa riêng, tách khỏi /data</text>
  <text x="466" y="242" font-size="11.5" fill="#5A6B68">• giữ nhiều bộ full + chuỗi WAL đầy đủ</text>
  <text x="466" y="262" font-size="11.5" fill="#5A6B68">• kèm pg_dump logic backup hằng ngày</text>
  <rect x="466" y="280" width="282" height="60" rx="8" fill="#F0F6F5"/>
  <text x="480" y="302" font-size="11.5" fill="#146B63" font-weight="bold">LỊCH TỰ ĐỘNG (cron)</text>
  <text x="480" y="322" font-size="11" fill="#5A6B68">Full: Chủ nhật · Diff: hằng ngày · WAL: liên tục</text>

  <!-- PITR -->
  <g filter="url(#sh)">
    <rect x="860" y="130" width="280" height="110" rx="10" fill="#E3EFED"/>
  </g>
  <text x="880" y="162" font-size="14" font-weight="bold" fill="#146B63">KHÔI PHỤC PITR</text>
  <text x="880" y="186" font-size="11.5" fill="#1A2423">Quay về đúng thời điểm bất kỳ</text>
  <text x="880" y="206" font-size="11.5" fill="#1A2423">(trước lúc xóa nhầm / lỗi logic)</text>
  <text x="880" y="228" font-size="11" fill="#2F7D4F" font-weight="bold">✓ đã diễn tập thành công</text>
  <line x1="776" y1="185" x2="856" y2="185" stroke="#146B63" stroke-width="2" marker-end="url(#arg)"/>

  <!-- Offsite proposed -->
  <rect x="860" y="270" width="280" height="90" rx="10" fill="#FFF7F0" stroke="#B4632A" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="300" font-size="14" font-weight="bold" fill="#1A2423">Off-site repo2</text>
  <text x="880" y="321" font-size="11.5" fill="#5A6B68">site khác / đĩa rời (air-gap — không cloud)</text>
  <rect x="880" y="330" width="106" height="18" rx="9" fill="#B4632A"/>
  <text x="933" y="343" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ĐỀ XUẤT — GĐ 2</text>
  <line x1="776" y1="315" x2="856" y2="315" stroke="#B4632A" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arw)"/>

  <!-- Retention timeline -->
  <text x="60" y="420" font-size="12" font-weight="bold" fill="#146B63" letter-spacing="2">NHỊP BẢO VỆ DỮ LIỆU TRONG TUẦN</text>
  <line x1="60" y1="470" x2="1140" y2="470" stroke="#D9E2E0" stroke-width="2"/>
  <g font-size="11" fill="#5A6B68" text-anchor="middle">
    <text x="130" y="500">CN</text><text x="270" y="500">T2</text><text x="410" y="500">T3</text>
    <text x="550" y="500">T4</text><text x="690" y="500">T5</text><text x="830" y="500">T6</text><text x="970" y="500">T7</text>
  </g>
  <circle cx="130" cy="470" r="14" fill="#146B63"/>
  <text x="130" y="475" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FULL</text>
  <g fill="#2F7D4F">
    <circle cx="270" cy="470" r="10"/><circle cx="410" cy="470" r="10"/><circle cx="550" cy="470" r="10"/>
    <circle cx="690" cy="470" r="10"/><circle cx="830" cy="470" r="10"/><circle cx="970" cy="470" r="10"/>
  </g>
  <g font-size="8.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <text x="270" y="473">DIFF</text><text x="410" y="473">DIFF</text><text x="550" y="473">DIFF</text>
    <text x="690" y="473">DIFF</text><text x="830" y="473">DIFF</text><text x="970" y="473">DIFF</text>
  </g>
  <rect x="116" y="438" width="1010" height="8" rx="4" fill="#E3EFED"/>
  <text x="1136" y="431" font-size="10.5" fill="#146B63" text-anchor="end" font-weight="bold">WAL archive liên tục — mất tối đa vài giây dữ liệu ở kịch bản xấu nhất</text>

  <!-- bottom stats -->
  <rect x="60" y="540" width="340" height="52" rx="8" fill="#E3EFED"/>
  <text x="230" y="562" font-size="12" fill="#146B63" text-anchor="middle" font-weight="bold">2 lớp bảo vệ</text>
  <text x="230" y="580" font-size="10.5" fill="#5A6B68" text-anchor="middle">sync replica (hỏng máy) + backup PITR (lỗi logic)</text>
  <rect x="430" y="540" width="340" height="52" rx="8" fill="#E3EFED"/>
  <text x="600" y="562" font-size="12" fill="#146B63" text-anchor="middle" font-weight="bold">Điểm khôi phục</text>
  <text x="600" y="580" font-size="10.5" fill="#5A6B68" text-anchor="middle">bất kỳ thời điểm nào trong chu kỳ lưu trữ</text>
  <rect x="800" y="540" width="340" height="52" rx="8" fill="#FFF7F0"/>
  <text x="970" y="562" font-size="12" fill="#B4632A" text-anchor="middle" font-weight="bold">Cần hoàn thiện: 3-2-1</text>
  <text x="970" y="580" font-size="10.5" fill="#5A6B68" text-anchor="middle">bổ sung bản off-site — đề xuất giai đoạn 2</text>
</svg>
